  catalogusprijs: 65000             # niet relevant: youngtimer rekent over de dagwaarde
  aanschafprijs: 7500               # dagwaarde nu (ONBEKEND); dit is het kapitaal dat erin zit
  btw_auto: false
  massa_ledig_kg: 1700
