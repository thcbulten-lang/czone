# Auto's. Elke auto draagt bron, datum en zekerheid (hoog / midden / laag).
# Let op de drie prijzen die fiscaal elk iets anders doen:
#   catalogusprijs  = nieuwprijs incl. btw en bpm, incl. fabrieksopties: de basis voor bijtelling en btw-correctie, ook bij een occasion
#   aanschafprijs   = wat we nu betalen, incl. btw
#   restwaarde      = volgt de curve uit regels.yaml (of restwaarde_jaarlijks_pct voor oude auto's)
# Verbruik is praktijkverbruik (kWh/100 km), niet WLTP.

- id: e_klasse_youngtimer
